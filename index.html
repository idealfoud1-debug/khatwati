    <script>
      // 1. Intercept Vite HMR WebSocket in sandbox/Cloud Run environment where HMR is disabled
      (function () {
        if (typeof window !== 'undefined') {
          // Suppress Vite HMR console error
          const originalConsoleError = console.error;
          console.error = function (...args) {
            const msg = args.map((a) => (a && (a.message || a.stack)) || String(a)).join(' ');
            if (msg.includes('WebSocket') || msg.includes('[vite]')) {
              return;
            }
            return originalConsoleError.apply(console, args);
          };

          // Shim Vite HMR WebSocket so it stays cleanly open and never errors
          if (window.WebSocket) {
            const NativeWebSocket = window.WebSocket;
            window.WebSocket = function (url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof protocols === 'string' && protocols.includes('vite')) ||
                (typeof url === 'string' && url.includes('vite'))
              ) {
                const target = new EventTarget();
                const fakeSocket = Object.assign(target, {
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: 'vite-hmr',
                  readyState: 1, // OPEN
                  url: String(url),
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  send: function () {},
                  close: function () {},
                });
                // Fire open event asynchronously so Vite client initializes cleanly
                setTimeout(() => {
                  fakeSocket.dispatchEvent(new Event('open'));
                }, 0);
                return fakeSocket;
              }
              return new NativeWebSocket(url, protocols);
            };

            window.WebSocket.prototype = NativeWebSocket.prototype;
            window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
            window.WebSocket.OPEN = NativeWebSocket.OPEN;
            window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
            window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
          }

          // Unhandled error listeners
          window.addEventListener('error', function (e) {
            if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function (e) {
            if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('vite'))) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);
        }
      })();
    </script>
