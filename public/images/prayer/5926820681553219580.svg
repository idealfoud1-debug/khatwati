<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FAF8F5" />
      <stop offset="100%" stopColor="#F1EDE4" />
    </linearGradient>

    <!-- Emerald Header Gradient -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#064E3B" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#064E3B" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Geometric Islamic Arch Watermark -->
  <g opacity="0.04" stroke="#064E3B" stroke-width="2" fill="none">
    <path d="M 600,60 C 400,60 200,240 200,500 L 200,800 L 1000,800 L 1000,500 C 1000,240 800,60 600,60 Z" />
    <path d="M 600,100 C 440,100 280,260 280,500 L 280,800 L 920,800 L 920,500 C 920,260 760,100 600,100 Z" />
    <circle cx="600" cy="400" r="280" />
    <polygon points="600,180 755,270 755,450 600,540 445,450 445,270" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1200" height="110" fill="url(#headerGrad)" />
  <line x1="0" y1="110" x2="1200" y2="110" stroke="#F59E0B" stroke-width="4" />

  <!-- App Brand & Title in Header -->
  <text x="1140" y="50" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FDFBF7" text-anchor="end">خُطْوَتِي — دَلِيلُ الصَّلَاةِ الْمَرْئِيِّ الْمُعْتَمَدِ</text>
  <text x="1140" y="85" font-family="sans-serif" font-size="18" fill="#FDE68A" text-anchor="end">الخطوة 5 من 14 • المذهب المالكي وسنة النبي ﷺ</text>

  <!-- Circular Badge (matching the user's photos) -->
  <g transform="translate(80, 55)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4" />
    <text x="0" y="14" font-family="sans-serif" font-size="40" font-weight="bold" fill="#064E3B" text-anchor="middle">⑤</text>
  </g>

  <!-- Step Title Banner -->
  <g transform="translate(600, 155)">
    <rect x="-350" y="-30" width="700" height="56" rx="28" fill="#FFFFFF" stroke="#064E3B" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="8" font-family="sans-serif" font-size="26" font-weight="bold" fill="#064E3B" text-anchor="middle">السجود الأول على الأعضاء السبعة</text>
  </g>
  <text x="600" y="215" font-family="sans-serif" font-size="17" fill="#64748B" text-anchor="middle" font-weight="500">تمكين الجبهة والأنف ورفع المرفقين عن الأرض</text>

  <!-- Prayer Rug (السجادة) -->
  <g id="prayer-rug" transform="translate(200, 590)">
    <!-- Rug Base -->
    <rect x="0" y="0" width="800" height="30" rx="15" fill="#C5A059" opacity="0.85" filter="url(#shadow)" />
    <!-- Rug borders -->
    <rect x="15" y="5" width="770" height="20" rx="10" fill="#064E3B" />
    <line x1="30" y1="15" x2="770" y2="15" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8,6" />
  </g>

  
        <!-- Figure: Sujood on 7 limbs -->
        <g id="figure" transform="translate(300, 240)">
          <!-- Ground line -->
          <line x1="-150" y1="320" x2="400" y2="320" stroke="#064E3B" stroke-width="3" />
          
          <!-- Head with Forehead and Nose firmly on ground -->
          <circle cx="280" cy="285" r="28" fill="#FAF8F5" stroke="#064E3B" stroke-width="4" />
          <!-- Nose touching carpet -->
          <ellipse cx="305" cy="310" rx="12" ry="8" fill="#E2E8F0" stroke="#064E3B" stroke-width="2.5" />

          <!-- Hands beside head on carpet -->
          <ellipse cx="230" cy="312" rx="20" ry="10" fill="#E2E8F0" stroke="#064E3B" stroke-width="3" />
          
          <!-- Lifted Arms / Elbows (not touching ground like a dog) -->
          <path d="M 170,170 Q 230,130 230,305" fill="none" stroke="#064E3B" stroke-width="18" stroke-linecap="round" />
          <path d="M 170,170 Q 230,130 230,305" fill="none" stroke="#FAF8F5" stroke-width="13" stroke-linecap="round" />

          <!-- Arched Back prostrating -->
          <path d="M -60,250 Q 80,60 210,240 L 170,270 Q 80,110 -30,280 Z" fill="#FAF8F5" stroke="#CBD5E1" stroke-width="3" />

          <!-- Thighs & Knees on carpet -->
          <ellipse cx="-40" cy="310" rx="26" ry="14" fill="#FAF8F5" stroke="#CBD5E1" stroke-width="3" />
          
          <!-- Feet upright with toes bent toward Qibla -->
          <ellipse cx="-110" cy="305" rx="14" ry="20" fill="#E2E8F0" stroke="#064E3B" stroke-width="2.5" />

          <!-- 7 Limbs Callouts -->
          <!-- 1. Head & Nose -->
          <circle cx="300" cy="315" r="14" fill="#D97706" />
          <text x="300" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
          
          <!-- 2. Hands -->
          <circle cx="230" cy="315" r="14" fill="#D97706" />
          <text x="230" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
          
          <!-- 3. Knees -->
          <circle cx="-40" cy="315" r="14" fill="#D97706" />
          <text x="-40" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
          
          <!-- 4. Toes -->
          <circle cx="-110" cy="315" r="14" fill="#D97706" />
          <text x="-110" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

          <text x="210" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#064E3B">رفع المرفقين ومجافاة البطن</text>
          <line x1="210" y1="90" x2="210" y2="135" stroke="#D97706" stroke-width="3" />
        </g>
        

  <!-- Focal Points Box (أسفل البطاقة) -->
  <rect x="80" y="650" width="1040" height="120" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Focal Box Header -->
  <rect x="940" y="662" width="160" height="30" rx="8" fill="#064E3B" />
  <text x="1020" y="682" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FDE68A" text-anchor="middle">نقاط الضبط والإتقان</text>

  
        <circle cx="750" cy="705" r="5" fill="#D97706" />
        <text x="735" y="710" font-family="sans-serif" font-size="15" fill="#1E293B" text-anchor="end" font-weight="500">السجود على 7 أعضاء: الجبهة مع الأنف، الكفان، الركبتان، أطراف القدمين</text>
        
        <circle cx="750" cy="731" r="5" fill="#D97706" />
        <text x="735" y="736" font-family="sans-serif" font-size="15" fill="#1E293B" text-anchor="end" font-weight="500">مجافاة العضدين عن الجنبين ورفع المرفقين عن الأرض</text>
        
        <circle cx="750" cy="757" r="5" fill="#D97706" />
        <text x="735" y="762" font-family="sans-serif" font-size="15" fill="#1E293B" text-anchor="end" font-weight="500">استقبال القبلة بأطراف أصابع القدمين والتسبيح: «سُبْحَانَ رَبِّيَ الأَعْلَى»</text>
        

  <!-- Footer Verification Stamp -->
  <g transform="translate(180, 715)">
    <circle cx="0" cy="0" r="26" fill="#064E3B" opacity="0.1" />
    <circle cx="0" cy="0" r="22" stroke="#064E3B" stroke-width="2" fill="none" />
    <text x="0" y="5" font-family="sans-serif" font-size="11" font-weight="bold" fill="#064E3B" text-anchor="middle">معتمد</text>
  </g>
</svg>
